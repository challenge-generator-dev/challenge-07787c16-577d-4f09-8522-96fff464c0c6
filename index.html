<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplicación de gestión de productos con React - Challenge de Arquitectura" />
    <meta name="keywords" content="React, TypeScript, Arquitectura, Frontend, Productos" />
    <meta name="author" content="Pragma Architecture Challenge" />
    <meta name="theme-color" content="#1976d2" />
    
    <title>React Architecture Challenge</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
      :root {
        --color-primary: #1976d2;
        --color-primary-dark: #1565c0;
        --color-secondary: #424242;
        --color-background: #ffffff;
        --color-surface: #f5f5f5;
        --color-text: #212121;
        --color-text-secondary: #757575;
        --color-error: #d32f2f;
        --color-success: #388e3c;
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 24px;
        --spacing-xl: 32px;
        --border-radius: 8px;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
        --shadow-md: 0 4px 6px rgba(0,0,0,0.15);
        --transition-fast: 150ms ease-in-out;
        --transition-normal: 250ms ease-in-out;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--color-text);
        background-color: var(--color-background);
        line-height: 1.5;
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: var(--color-primary);
        color: white;
        padding: var(--spacing-md) var(--spacing-lg);
        box-shadow: var(--shadow-md);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      header h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      main {
        flex: 1;
        padding: var(--spacing-lg);
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }

      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 200px;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--color-surface);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .error-container {
        background-color: #ffebee;
        border: 1px solid var(--color-error);
        border-radius: var(--border-radius);
        padding: var(--spacing-lg);
        margin: var(--spacing-lg) 0;
        text-align: center;
      }

      .error-container h2 {
        color: var(--color-error);
        margin-bottom: var(--spacing-sm);
      }

      footer {
        background-color: var(--color-secondary);
        color: white;
        padding: var(--spacing-md) var(--spacing-lg);
        text-align: center;
        margin-top: auto;
      }

      footer p {
        font-size: 0.875rem;
        opacity: 0.9;
      }

      @media (max-width: 768px) {
        html {
          font-size: 14px;
        }

        main {
          padding: var(--spacing-md);
        }

        header h1 {
          font-size: 1.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header>
        <h1>Gestión de Productos</h1>
      </header>
      <main>
        <div class="loading-container" aria-label="Cargando aplicación">
          <div class="loading-spinner" role="status"></div>
          <p>Cargando aplicación...</p>
        </div>
      </main>
      <footer>
        <p>© 2024 Pragma Architecture Challenge - React</p>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
